name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - data/**
      - schema/**
  # Allow triggering manually from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN the minimum permissions needed
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assemble only the files that belong on the public site.
      # Excluded: specs/, skills/, .github/, README.md
      - name: Prepare site files
        run: |
          mkdir -p _site/data _site/schema
          cp index.html _site/
          cp data/incidents.json _site/data/
          cp schema/incident.schema.json _site/schema/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
